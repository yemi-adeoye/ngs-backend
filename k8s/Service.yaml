apiVersion: v1
kind: Service
metadata:
  name: ngs-backend-service
spec:
  selector:
    app: ngs
  type: LoadBalancer
  ports:
    - port: 5000
      protocol: TCP
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
spec:
  selector:
    app: mysql
  clusterIP: None
  ports:
    - port: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
spec:
  selector:
    app: redis
  clusterIP: None
  ports:
    - port: 6379
